name: Semgrep Analysis on PR

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      version: 1.3.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required to have full history and compare commits

      - name: Run security audit (semgrep)
        env:
          SECURITY_SLACK_WEBHOOK_URL: ${{ secrets.SECURITY_SLACK_WEBHOOK_URL }}
          SECURITY_SLACK_CHANNEL: ${{ secrets.SECURITY_SLACK_CHANNEL }}
          URL: ${{ github.event.pull_request.html_url || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}

        run: |
          echo "Github Action version: $version"
          echo "SECURITY_SLACK_WEBHOOK_URL=${SECURITY_SLACK_WEBHOOK_URL}" > /tmp/config.env
          echo "SECURITY_SLACK_CHANNEL=${SECURITY_SLACK_CHANNEL}" >> /tmp/config.env
          echo "URL=${URL}" >> /tmp/config.env
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}" >> /tmp/config.env
          echo "GITHUB_REF=${GITHUB_REF}" >> /tmp/config.env
          echo "GITHUB_HEAD_REF=${GITHUB_HEAD_REF}" >> /tmp/config.env

          docker pull public.ecr.aws/m5g2x0g1/security/semgrep-analysis:latest >/dev/null 2>&1

          docker run --rm \
            -v $PWD:/app \
            --env-file=/tmp/config.env \
            --user $(id -u):$(id -g) \
            public.ecr.aws/m5g2x0g1/security/semgrep-analysis:latest
